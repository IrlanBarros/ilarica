services:
  backend:
    build:
      context: ./back-end
    container_name: ilarica-backend
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - ilarica-network

  frontend:
    build:
      context: ./front-end
    container_name: ilarica-frontend
    command: ["sh", "-c", "npm run build && npm run preview -- --host 0.0.0.0 --port 4173"]
    networks:
      - ilarica-network

  nginx:
    image: nginx:alpine
    container_name: ilarica-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - ilarica-network

networks:
  ilarica-network:
    driver: bridge
