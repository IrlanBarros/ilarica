name: iLarica CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ./back-end

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: back-end/requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with Ruff
        run: |
          ruff check app tests scripts

  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ./back-end

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: back-end/requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy

      - name: Type check with mypy
        run: |
          mypy app

  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs:
      - lint
      - type-check

    defaults:
      run:
        shell: bash
        working-directory: ./back-end

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ilarica_admin
          POSTGRES_PASSWORD: ilarica_pass
          POSTGRES_DB: ilarica_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ilarica_admin -d ilarica_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: .
      DATABASE_URL: postgresql+psycopg2://ilarica_admin:ilarica_pass@localhost:5432/ilarica_db
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: ilarica_admin
      DB_PASSWORD: ilarica_pass
      DB_NAME: ilarica_db
      SECRET_KEY: ci-test-secret-key
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: back-end/requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov httpx

      - name: Run integration tests with pytest
        run: |
          pytest -q --maxfail=1 --disable-warnings \
            --cov=app --cov-report=term-missing --cov-report=xml --junitxml=pytest-report.xml

      - name: Upload test and coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-artifacts
          path: |
            back-end/coverage.xml
            back-end/pytest-report.xml
