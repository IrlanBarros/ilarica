services:
  frontend:
    build:
      context: ./front-end
    container_name: ilarica-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./front-end:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    networks:
      - ilarica-network

  backend:
    build:
      context: ./back-end
    container_name: ilarica-backend
    ports:
      - "8000:8000"
    volumes:
      - ./back-end:/app
    env_file:
      - ./.env
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - ilarica-network

  nginx:
    image: nginx:alpine
    container_name: ilarica-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - ilarica-network

networks:
  ilarica-network:
    driver: bridge
