services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${DB_USER:-ilarica_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ilarica_pass}
      POSTGRES_DB: ${DB_NAME:-ilarica_db}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ilarica_admin} -d ${DB_NAME:-ilarica_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ilarica-network

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ilarica-network

networks:
  ilarica-network:
    driver: bridge

volumes:
  pgdata:
    name: ilarica-pgdata
  redisdata:
    name: ilarica-redisdata
