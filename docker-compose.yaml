services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ilarica_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ilarica_pass}
      POSTGRES_DB: ${DB_NAME:-ilarica_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ilarica_user} -d ${DB_NAME:-ilarica_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ilarica-network

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ilarica-network

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: on-failure
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-ilarica_user}
      DB_PASSWORD: ${DB_PASSWORD:-ilarica_pass}
      DB_NAME: ${DB_NAME:-ilarica_db}
      REDIS_HOST: cache
      REDIS_PORT: 6379
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    volumes:
      - ./app:/usr/src/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - ilarica-network

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - ilarica-network

networks:
  ilarica-network:
    driver: bridge

volumes:
  pgdata:
    name: ilarica-pgdata
  redisdata:
    name: ilarica-redisdata