events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # Roteamento para o Front-end (Vite/React)
        location / {
            proxy_pass http://frontend:5173; # NOME DO SERVIÇO:PORTA
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Roteamento para o Back-end (API Python)
        # Assumindo que sua API responda na rota /api
        location /api/ {
            proxy_pass http://backend:8000/; # NOME DO SERVIÇO:PORTA
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}